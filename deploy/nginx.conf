# ShilingiBet back office - nginx site config.
# Install:  sudo cp deploy/nginx.conf /etc/nginx/sites-available/shilingibet-dashboard
#           sudo ln -s /etc/nginx/sites-available/shilingibet-dashboard /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
# HTTPS:    sudo certbot --nginx -d dashboard.shilingibet.com
server {
    listen 80;
    server_name dashboard.shilingibet.com;

    root /var/www/shilingibet-dashboard;
    index index.html;

    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Hashed build files never change, so browsers can keep them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Always fetch a fresh index.html so staff get new releases straight away.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Single-page app: unknown paths load the app, which handles routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
